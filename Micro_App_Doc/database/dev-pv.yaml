apiVersion: v1
kind: PersistentVolume

metadata:
  name: postgres-dev-pv
  labels:
    app: postgres
    environment: dev

spec:
  capacity:
    storage: 5Gi

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  storageClassName: local-storage

  volumeMode: Filesystem

  local:
    path: /mnt/data/postgres-dev

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker1
