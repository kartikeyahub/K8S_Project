apiVersion: v1
kind: Service

metadata:
  name: {{ include "item-service.fullname" . }}

  labels:
    {{- include "item-service.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "item-service.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
