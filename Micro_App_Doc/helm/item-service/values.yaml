replicaCount: 1

image:
  repository: kartikeyasoft/item-service
  tag: latest
  pullPolicy: Always

containerPort: 8082

service:
  type: ClusterIP
  port: 8082

database:
  configMapName: external-postgres-item
  urlKey: SPRING_DATASOURCE_URL

  existingSecret: dev-db-secret
  usernameKey: DB_USERNAME
  passwordKey: DB_PASSWORD

jpa:
  ddlAuto: update

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

probes:
  startup:
    periodSeconds: 10
    failureThreshold: 30
  readiness:
    periodSeconds: 10
  liveness:
    periodSeconds: 20
