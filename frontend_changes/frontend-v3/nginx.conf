server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # ------------------------------------------------------------------
    # API gateway routes
    # The browser calls /api/... . The Spring controllers in this project
    # are mapped to /auth, /users and /items, so Nginx strips the /api
    # prefix and forwards the matching service path.
    # ------------------------------------------------------------------

    # AuthController: @RequestMapping("/auth")
    # /api/auth/register -> /auth/register
    # /api/auth/login    -> /auth/login
    location = /api/auth {
        return 308 /api/auth/;
    }

    location ^~ /api/auth/ {
        proxy_pass http://auth-service:8080/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # UserController: @RequestMapping("/users")
    # /api/users     -> /users
    # /api/users/123 -> /users/123
    location = /api/users {
        proxy_pass http://user-service:8081/users;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/users/ {
        proxy_pass http://user-service:8081/users/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ItemController: @RequestMapping("/items")
    # /api/items     -> /items
    # /api/items/123 -> /items/123
    location = /api/items {
        proxy_pass http://item-service:8082/items;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/items/ {
        proxy_pass http://item-service:8082/items/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Serve the frontend application.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
